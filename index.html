
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>FINX CLUB — Club d'investissement</title>
      <meta name="description" content="FINX CLUB, société d'investissement et club privé : gouvernance, parts, valeur liquidative et espace membres." />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="icon" type="image/png" href="/symbol-finx.png" />
      <script>
        (function () {
          try {
            var mode = localStorage.getItem('finx-color-mode');
            var next = mode === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-mode', next);
            document.documentElement.classList.toggle('dark', next === 'dark');
            document.documentElement.style.colorScheme = next;
          } catch (e) {
            document.documentElement.setAttribute('data-mode', 'light');
          }
        })();
      </script>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
